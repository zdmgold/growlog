name: growlog
description: Plant care progress tracker with visual growth timeline
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  shared_preferences: ^2.3.0
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0
  share_plus: ^10.0.0
  image_picker: ^1.1.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  fl_chart: ^0.68.0
  in_app_purchase: ^3.0.0
  google_mobile_ads: ^5.0.0
  cupertino_icons: ^1.0.8
  uuid: ^4.4.0
  file_picker: ^8.0.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

# Section 10: custom launcher icon at all densities + branded splash
# — no default Flutter icon, no blank-white-flash launch. Run
# `dart run flutter_launcher_icons` and
# `dart run flutter_native_splash:create` after adding the real
# assets/images/icon.png and assets/images/splash_logo.png files
# (not included here — these are binary image assets, not something
# generated as Dart/config source).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2D6A4F"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"

flutter_native_splash:
  color: "#FAFAF8"
  color_dark: "#0A0A0A"
  image: "assets/images/splash_logo.png"
  image_dark: "assets/images/splash_logo.png"
  android_12:
    color: "#FAFAF8"
    color_dark: "#0A0A0A"
    image: "assets/images/splash_logo.png"
  android: true
  ios: true
