name: Emulator Offline

# Manual only. Builds a debug APK inside the runner, runs it on an Android emulator, takes screenshots and logs.
# The APK is never uploaded. Screenshots and logs go to the ci-report-emu branch.
on:
  workflow_dispatch:
  push:
    branches: [ci-emulator-offline]

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: flutter create --platforms=android .
      - run: rm -f android/app/build.gradle.kts
      - name: Remove incomplete preinstalled NDK
        run: |
          for d in "$ANDROID_SDK_ROOT"/ndk/*; do
            if [ -d "$d" ] && [ ! -f "$d/source.properties" ]; then sudo rm -rf "$d"; fi
          done
      - name: Install Gradle init script (plugin compileSdk 36)
        run: |
          mkdir -p ~/.gradle/init.d
          cp .github/gradle/force-plugin-compilesdk.gradle ~/.gradle/init.d/
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build apk --debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash .github/scripts/emulator_offline.sh
      - name: Publish screenshots and logs
        if: always()
        run: |
          mkdir -p /tmp/emu; touch /tmp/emu/none
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/rep
          cd /tmp/rep
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-report-emu-${{ github.ref_name }}; git rm -rf . -q || true
          cp /tmp/emu/*.png /tmp/emu/*.txt /tmp/emu/*.xml . 2>/dev/null || true
          rm -f logcat_full.txt
          git add -A; git commit -q -m "emulator smoke" || true; git push -f origin ci-report-emu-${{ github.ref_name }}
