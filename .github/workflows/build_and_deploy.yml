name: Build Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Repair missing Android platform files
        run: flutter create --platforms=android .

      - name: Get Flutter packages
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build App Bundle (for Play Store submission)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/symbols

      - name: Build APK (for direct sideload testing)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          flutter build apk --release \
            --obfuscate --split-debug-info=build/symbols

      - name: Build debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: flutter build apk --debug

      - name: Upload AAB
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: growlog-android-aab
          path: build/app/outputs/bundle/release/*.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: growlog-android-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload debug symbols
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: growlog-android-symbols
          path: build/symbols/
