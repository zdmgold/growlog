name: Build Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Repair missing Android platform files
        run: flutter create --platforms=android .

      - name: Use the repo's Android app build script
        run: rm -f android/app/build.gradle.kts

      - name: Remove incomplete preinstalled NDK
        run: |
          for d in "$ANDROID_SDK_ROOT"/ndk/*; do
            if [ -d "$d" ] && [ ! -f "$d/source.properties" ]; then
              echo "removing incomplete NDK $d"
              sudo rm -rf "$d"
            fi
          done

      - name: Install Gradle init script (plugin compileSdk 36)
        run: |
          mkdir -p ~/.gradle/init.d
          cp .github/gradle/force-plugin-compilesdk.gradle ~/.gradle/init.d/

      - name: Get Flutter packages
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Set up release signing
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          KS_B64: ${{ secrets.GROWLOG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "No keystore secret; release will be debug-signed"; exit 0; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "GROWLOG_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "GROWLOG_KEYSTORE_PASSWORD=${{ secrets.GROWLOG_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "GROWLOG_KEY_ALIAS=${{ secrets.GROWLOG_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "GROWLOG_KEY_PASSWORD=${{ secrets.GROWLOG_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build App Bundle (for Play Store submission)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/symbols

      - name: Build APK (for direct sideload testing)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/symbols

      - name: Build debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: flutter build apk --debug

      - name: Verify release signature
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          EXPECTED="F0:E4:D7:A5:1A:AA:98:A3:C9:23:66:FE:93:82:13:BC:E2:CD:9C:FA:3F:21:9B:90:2F:11:A5:BF:4B:F6:0F:9E"
          for f in build/app/outputs/bundle/release/*.aab build/app/outputs/flutter-apk/*-release.apk; do
            got=$(keytool -printcert -jarfile "$f" | grep "SHA256:" | head -1 | sed 's/.*SHA256: //')
            echo "$f -> $got"
            [ "$got" = "$EXPECTED" ] || { echo "SIGNATURE MISMATCH for $f"; exit 1; }
          done

      - name: Upload AAB
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: growlog-android-aab
          path: build/app/outputs/bundle/release/*.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: growlog-android-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload debug symbols
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: growlog-android-symbols
          path: build/symbols/
