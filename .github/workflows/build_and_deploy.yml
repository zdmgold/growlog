name: Build Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Repair missing Android platform files
        run: flutter create --platforms=android .

      - name: Fix Kotlin version in generated settings.gradle
        run: |
          # Show original for debugging
          echo "=== BEFORE ==="
          cat android/settings.gradle
          
          # Try every possible quote style and pattern
          sed -i 's/kotlin_android.*version.*/kotlin_android version "1.9.24" apply false/' android/settings.gradle
          sed -i "s/kotlin_android.*version.*/kotlin_android version '1.9.24' apply false/" android/settings.gradle
          sed -i 's/org.jetbrains.kotlin.android.*version.*/id "org.jetbrains.kotlin.android" version "1.9.24" apply false/' android/settings.gradle
          sed -i "s/org.jetbrains.kotlin.android.*version.*/id 'org.jetbrains.kotlin.android' version '1.9.24' apply false/" android/settings.gradle
          
          # Also try without apply false
          sed -i 's/org.jetbrains.kotlin.android.*version.*/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          sed -i "s/org.jetbrains.kotlin.android.*version.*/id 'org.jetbrains.kotlin.android' version '1.9.24'/" android/settings.gradle
          
          echo "=== AFTER ==="
          cat android/settings.gradle

      - name: Force compileSdk 34 on ALL plugins
        run: |
          # Patch every plugin's build.gradle to use compileSdk 34 instead of 35
          find $PUB_CACHE -path "*/android/build.gradle" -print0 | while IFS= read -r -d '' file; do
            sed -i 's/compileSdk 35/compileSdk 34/g' "$file"
            sed -i 's/compileSdkVersion 35/compileSdkVersion 34/g' "$file"
            sed -i 's/compileSdk = 35/compileSdk = 34/g' "$file"
          done
          echo "Patched all plugins to compileSdk 34"

      - name: Get Flutter packages
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build App Bundle (for Play Store submission)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/symbols

      - name: Build APK (for direct sideload testing)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          flutter build apk --release \
            --obfuscate --split-debug-info=build/symbols

      - name: Build debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: flutter build apk --debug

      - name: Upload AAB
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: growlog-android-aab
          path: build/app/outputs/bundle/release/*.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: growlog-android-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload debug symbols
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: growlog-android-symbols
          path: build/symbols/
