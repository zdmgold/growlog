name: Emulator Release

# Manual only. Builds a debug APK inside the runner, runs it on an Android emulator, takes screenshots and logs.
# The APK is never uploaded. Screenshots and logs go to the ci-report-emu branch.
on:
  workflow_dispatch:
  push:
    branches: [ci-emulator-release]

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: growlog-android-apk
          path: apk
          run-id: 41798192726
          github-token: ${{ github.token }}
      - run: ls -la apk
      - name: Download real plant photos for the test
        run: |
          pip install requests
          python3 - <<'EOF'
          import requests, re, os, random
          H = {"User-Agent": "GrowLogEmuTest/0.1 (https://github.com/zdmgold/growlog; evaluation only)"}
          API = "https://commons.wikimedia.org/w/api.php"
          os.makedirs("/tmp/photos", exist_ok=True)
          want = ["Monstera deliciosa", "Aloe vera", "Epipremnum aureum", "Zamioculcas zamiifolia", "Ficus lyrata"]
          for i, name in enumerate(want):
              try:
                  m = requests.get(API, params={"action":"query","list":"categorymembers","cmtitle":"Category:"+name,"cmtype":"file","cmlimit":"60","format":"json"}, headers=H, timeout=40).json()["query"]["categorymembers"]
                  titles = [x["title"] for x in m if x["title"].lower().endswith((".jpg", ".jpeg"))][:40]
                  d = requests.get(API, params={"action":"query","titles":"|".join(titles),"prop":"imageinfo","iiprop":"url|size|extmetadata","iiurlwidth":"1000","format":"json"}, headers=H, timeout=40).json()["query"]["pages"]
                  done = False
                  for pg in d.values():
                      ii = (pg.get("imageinfo") or [{}])[0]
                      lic = (ii.get("extmetadata", {}).get("LicenseShortName", {}) or {}).get("value", "")
                      if ii.get("thumburl") and min(ii.get("width", 0), ii.get("height", 0)) >= 700 and re.match(r"(CC0|Public domain|CC BY)", lic):
                          r = requests.get(ii["thumburl"], headers=H, timeout=60)
                          if r.status_code == 200:
                              open("/tmp/photos/%d_%s.jpg" % (i, name.replace(" ", "_")), "wb").write(r.content)
                              print("got", name, lic, len(r.content)); done = True; break
                  if not done: print("no photo for", name)
              except Exception as e:
                  print("failed", name, e)
          EOF
          ls -la /tmp/photos
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: APK_PATH=apk/app-x86_64-release.apk bash .github/scripts/emulator_offline.sh
      - name: Publish screenshots and logs
        if: always()
        run: |
          mkdir -p /tmp/emu; touch /tmp/emu/none
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/rep
          cd /tmp/rep
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-report-emu-${{ github.ref_name }}; git rm -rf . -q || true
          cp /tmp/emu/*.png /tmp/emu/*.txt /tmp/emu/*.xml . 2>/dev/null || true
          rm -f logcat_full.txt
          git add -A; git commit -q -m "emulator smoke" || true; git push -f origin ci-report-emu-${{ github.ref_name }}
